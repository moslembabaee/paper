services:
  paper:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: paper:latest
    container_name: paper
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    volumes:
      # Persist user projects and canvas state on the host
      - paper_projects:/data/projects
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  paper_projects:
    driver: local
